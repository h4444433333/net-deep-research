name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tooling
        run: pip install build twine
      - name: Build
        if: matrix.python-version == '3.12'
        run: python -m build
      - name: Twine check
        if: matrix.python-version == '3.12'
        run: twine check dist/*
      - name: Install smoke test
        if: matrix.python-version == '3.12'
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/net_deep_research-*-py3-none-any.whl
          /tmp/smoke/bin/python -c "import net_deep_research as n; from net_deep_research import research; print(n.__version__)"
          /tmp/smoke/bin/net-deep-research --help
